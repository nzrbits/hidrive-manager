[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidrive-manager"
version = "0.1.0"
description = "Command line manager for IONOS/STRATO HiDrive over WebDAV: ls, put, get, sync, rm, mv, du, find"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "nzrbits" }]
keywords = ["hidrive", "ionos", "strato", "webdav", "cli", "sync", "backup"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "requests>=2.32",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hidrive = "hidrive_manager.cli:main"

[project.urls]
Homepage = "https://github.com/nzrbits/hidrive-manager"
Changelog = "https://github.com/nzrbits/hidrive-manager/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["hidrive_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
